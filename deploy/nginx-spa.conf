# Konteyner ICHIDAGI nginx — faqat statik fayllarni tarqatadi.
# Tashqi (host) nginx bu konteynerga 127.0.0.1:4004 orqali murojaat qiladi.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CRA fayl nomiga hash qo'yadi (main.540a6ccb.js) — bir yil keshlash xavfsiz
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html HECH QACHON keshlanmasin, aks holda yangi deploydan keyin ham
    # foydalanuvchi eski sahifani ko'rib turaveradi
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: /orders da F5 bosilganda diskda "orders" fayli yo'q —
    # index.html qaytaramiz, keyin React Router hal qiladi
    location / {
        try_files $uri /index.html;
    }
}
